# RogerOS: el instalador empieza en España (hora de Madrid, español de España).
# Con esto también propone el teclado español, igual que el del modo en vivo:
# así la contraseña que se escribe al instalar es la misma que al entrar.
region: "Europe"
zone: "Madrid"
localeGenPath: "/etc/locale.gen"
geoip:
    style: "none"
