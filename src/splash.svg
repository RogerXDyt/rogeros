  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g stroke="#ff2bd6" stroke-width="1" opacity="0.35">
    <line x1="0" y1="560" x2="800" y2="560"/><line x1="0" y1="580" x2="800" y2="580"/>
    <line x1="400" y1="540" x2="100" y2="600"/><line x1="400" y1="540" x2="700" y2="600"/>
